services:
  # Orquestador: ingesta, dbt, Spark y (más adelante) lotes, monitoreo y reentrenamiento
  kestra:
    image: kestra/kestra:latest
    command: server local
    user: "root"
    ports: ["8080:8080"]
    environment:
      ENV_SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      ENV_SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      ENV_SNOWFLAKE_PAT: ${SNOWFLAKE_PAT}
      ENV_SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      ENV_SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      ENV_FUENTE_URL: ${FUENTE_URL}
      ENV_PROYECTO: ${PWD}
      KESTRA_CONFIGURATION: |
        kestra:
          server:
            basic-auth:
              enabled: true
              username: ${KESTRA_USER}
              password: ${KESTRA_PASSWORD}
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp

          plugins:
            configurations:
              - type: io.kestra.plugin.scripts.runner.docker.Docker
                values:
                  volume-enabled: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - kestra-data:/app/storage

  # Registro de experimentos y modelos (PSet 3)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    restart: unless-stopped
    ports: ["5000:5000"]
    volumes:
      - ./mlflow:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts

  # Servicio de prediccion (seccion 2 del PSet 4)
  api:
    image: ghcr.io/stephania99c/pset4-api:${API_TAG:-local}
    build: ./api
    ports: ["8000:8000"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODO_RESPALDO: ${MODO_RESPALDO:-false}
      REGISTRO_PREDICCIONES: /app/registros/predicciones.csv
    volumes:
      - ./registros:/app/registros
    depends_on: [mlflow]
    
  # Tablero de monitoreo (seccion 6.4). Su imagen es la misma que usa Kestra para los scripts.
  tablero:
    image: proyecto-ml:1.0
    build:
      context: .
      dockerfile: herramientas/Dockerfile.ml
    env_file: .env
    ports: ["8501:8501"]
    volumes:
      - ./:/proyecto
    command: streamlit run /proyecto/monitoreo/tablero.py --server.port 8501 --server.address 0.0.0.0
    depends_on: [mlflow]

  # Herramientas del PSet 2 (se usan desde Kestra o a mano con "docker compose run")
  dbt:
    image: pset2-tools:1.0
    profiles: ["herramientas"]
    env_file: .env
    environment:
      DBT_PROFILES_DIR: /app/dbt
    working_dir: /app/dbt
    volumes:
      - ./dbt:/app/dbt
    entrypoint: ["dbt"]

  spark:
    image: pset2-tools:1.0
    profiles: ["herramientas"]
    env_file: .env
    working_dir: /app/spark
    volumes:
      - ./spark:/app/spark
    entrypoint: ["spark-submit", "--driver-memory", "4g"]

volumes:
  kestra-data: