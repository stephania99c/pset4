id: reentrenamiento
namespace: proyecto.cartera
description: |
  Reentrenamiento (seccion 7). Lo dispara el monitoreo cuando el PR-AUC queda
  bajo el umbral 3 lotes seguidos. Entrena el challenger, lo compara con el
  champion en el lote etiquetado mas reciente y espera la aprobacion de una
  persona antes de mover el alias champion.

inputs:
  - id: fecha
    type: STRING
    description: Fecha del lote en que se disparo (AAAA-MM-DD)
  - id: motivo
    type: STRING
    defaults: "Reentrenamiento manual"

tasks:
  - id: entrenar_challenger
    type: io.kestra.plugin.scripts.python.Commands
    commands:
      - python /proyecto/src/reentrenar.py entrenar {{ inputs.fecha }} "{{ inputs.motivo }}"

  - id: aprobacion
    type: io.kestra.plugin.core.flow.Pause
    description: |
      Revisa la comparacion en el log de la tarea anterior y en MLflow.
      Recomendacion de la regla de promocion: {{ outputs.entrenar_challenger.vars.recomendacion }}.
      Para continuar: Resume, marca "aprobar" si se promueve y escribe el motivo.
    onResume:
      - id: aprobar
        type: BOOLEAN
        defaults: false
      - id: comentario
        type: STRING
        defaults: "Sin comentario"

  - id: decidir
    type: io.kestra.plugin.scripts.python.Commands
    commands:
      - python /proyecto/src/reentrenar.py decidir {{ outputs.entrenar_challenger.vars.version }} {{ outputs.aprobacion.onResume.aprobar }} "{{ outputs.aprobacion.onResume.comentario }}"

errors:
  - id: avisar_error
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Fallo el reentrenamiento: {{ errorLogs()[0]['message'] }}"

pluginDefaults:
  - type: io.kestra.plugin.scripts.python.Commands
    values:
      containerImage: proyecto-ml:1.0
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
        pullPolicy: NEVER
        networkMode: proyecto_final_default
        volumes:
          - "{{ envs.proyecto }}:/proyecto"
      env:
        MLFLOW_TRACKING_URI: http://mlflow:5000